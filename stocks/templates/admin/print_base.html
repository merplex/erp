<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>{% block page_title %}เอกสาร{% endblock %}</title>
<style>
    @page {
        size: A4;
        margin: 12mm 14mm;
    }
    * { box-sizing: border-box; }
    body {
        font-family: "Sarabun", "Tahoma", sans-serif;
        color: #222;
        margin: 0;
        padding: 24px;
        background: #f2f2f2;
    }
    .toolbar {
        max-width: 800px;
        margin: 0 auto 12px auto;
        text-align: right;
    }
    .toolbar button {
        background: #17a2b8;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 10px 24px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }
    .toolbar button:hover { background: #138496; }

    .sheet-wrap {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        box-shadow: 0 0 8px rgba(0,0,0,0.15);
    }

    /* ใช้ <table> ห่อทั้งเอกสาร เพราะ thead/tfoot ของ table เท่านั้น
       ที่เบราว์เซอร์ยอมรับปากว่า "ซ้ำทุกหน้า" ตอนพิมพ์เอกสารหลายหน้า
       (position: fixed ใช้ไม่ได้ผลแน่นอนเวลาพิมพ์ข้ามหน้า) */
    table.print-doc {
        width: 100%;
        border-collapse: collapse;
    }
    table.print-doc > thead > tr > td,
    table.print-doc > tfoot > tr > td,
    table.print-doc > tbody > tr > td {
        padding: 24px 32px;
    }
    table.print-doc > thead > tr > td { padding-bottom: 0; }
    table.print-doc > tfoot > tr > td { padding-top: 0; }

    .doc-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-bottom: 3px solid #333;
        padding-bottom: 12px;
        margin-bottom: 8px;
    }
    /* พื้นที่เผื่อใส่โลโก้/รูปหัวกระดาษของบริษัท (ฟีเจอร์อัปโหลดผ่านเว็บจะเพิ่มทีหลัง) */
    .doc-header .logo-area img { max-height: 60px; display: block; margin-bottom: 6px; }
    .doc-header h1 { margin: 0; font-size: 24px; }
    .doc-header .company { font-size: 14px; color: #555; }
    .doc-header .doc-number { text-align: right; font-size: 15px; white-space: nowrap; }
    .doc-header .doc-number strong { font-size: 18px; color: #17a2b8; }

    .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 24px;
        margin-bottom: 24px;
        font-size: 14px;
    }
    .info-grid .label { color: #666; }

    table.line-items {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 24px;
        font-size: 14px;
    }
    table.line-items th, table.line-items td {
        border: 1px solid #ccc;
        padding: 8px 10px;
    }
    table.line-items th { background: #f5f5f5; text-align: left; }
    table.line-items td.num { text-align: right; }

    .status-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 12px;
        background: #e9ecef;
        font-size: 13px;
    }
    .notes-box {
        border: 1px solid #ccc;
        padding: 12px;
        min-height: 50px;
        font-size: 14px;
        margin-bottom: 8px;
        white-space: pre-wrap;
    }

    .signatures {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 24px;
        margin-top: 40px;
        padding-top: 20px;
        text-align: center;
        font-size: 14px;
        border-top: 1px solid #ddd;
    }
    .signatures .line {
        margin-top: 50px;
        border-top: 1px solid #333;
        padding-top: 6px;
    }

    @media print {
        body { background: #fff; padding: 0; }
        .toolbar { display: none; }
        .sheet-wrap { box-shadow: none; max-width: none; }
    }
    {% block extra_style %}{% endblock %}
</style>
</head>
<body>
    <div class="toolbar">
        <button onclick="window.print()">🖨️ พิมพ์ / บันทึกเป็น PDF</button>
    </div>

    <div class="sheet-wrap">
        <table class="print-doc">
            <thead>
                <tr><td>
                    {% block doc_header %}
                    <div class="doc-header">
                        <div>
                            <div class="logo-area"><!-- เผื่อรูปหัวกระดาษบริษัทในอนาคต --></div>
                            <h1>{% block doc_title %}{% endblock %}</h1>
                            <div class="company">Meebun ERP</div>
                        </div>
                        <div class="doc-number">
                            เลขที่เอกสาร<br>
                            <strong>{% block doc_number %}{% endblock %}</strong>
                        </div>
                    </div>
                    {% endblock %}
                </td></tr>
            </thead>
            <tfoot>
                <tr><td>
                    <div class="signatures">
                        {% block signatures %}
                        <div><div class="line">ผู้สั่ง</div></div>
                        <div><div class="line">ผู้จัดทำ</div></div>
                        <div><div class="line">ผู้ตรวจสอบ</div></div>
                        {% endblock %}
                    </div>
                </td></tr>
            </tfoot>
            <tbody>
                <tr><td>
                    {% block doc_body %}{% endblock %}
                </td></tr>
            </tbody>
        </table>
    </div>
</body>
</html>
